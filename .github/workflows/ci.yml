name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipi
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Il budget del bundle è una promessa del progetto, quindi è un test.
      - name: Budget bundle
        run: npm run size
